[project]
name = "lang-study-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "spirtanol"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "sqlalchemy[asyncio] (>=2.1.3,<2.2.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "aiogram (>=3.31.0,<4.0.0)",
    "langgraph (>=1.2.14,<2.0.0)",
    "click (>=8.5.0,<9.0.0)",
    "typer (>=0.27.3,<0.28.0)",
    "taskiq (>=0.13.0,<0.14.0)",
    "taskiq-aio-pika (>=0.6.1,<0.7.0)",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai (>=4.4.2,<5.0.0)"]
ollama = ["langchain-ollama (>=1.1.0,<2.0.0)"]

[tool.poetry]
packages = [{ include = "app", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
pytest-asyncio = ">=1.2,<2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
